<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F4F1EA" />
    <meta name="description" content="Construo aplicações e automações para resolver problemas do dia a dia, com interesse em ferramentas para e-commerce." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Carlos Alberto | Desenvolvedor full stack</title>
    <!-- Compartilhamento. URL canônica, og:url e imagem dependem do domínio: veja siteMeta em vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Carlos Alberto" />
    <meta property="og:title" content="Carlos Alberto | Desenvolvedor full stack" />
    <meta property="og:description" content="Construo aplicações e automações para resolver problemas do dia a dia, com interesse em ferramentas para e-commerce." />
    <meta name="twitter:title" content="Carlos Alberto | Desenvolvedor full stack" />
    <meta name="twitter:description" content="Construo aplicações e automações para resolver problemas do dia a dia, com interesse em ferramentas para e-commerce." />
    <script>
      // Aplica o tema antes da primeira pintura: preferência salva ou, sem ela, a do sistema.
      (function () {
        var theme = 'light'
        try {
          var saved = localStorage.getItem('carlos-theme')
          theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#121110')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Este portfólio precisa de JavaScript ativado para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
